                    Transaction Alert
                </button>
                <button class="alert-btn px-4 py-3 border-2 border-blue-600 bg-white text-blue-600 rounded-lg font-semibold hover:shadow-md transition-all hover:-translate-y-0.5" data-alert-type="suspicious">
                    Suspicious Activity

                <button class="alert-btn px-4 py-3 border-2 border-blue-600 bg-white text-blue-600 rounded-lg font-semibold hover:shadow-md transition-all hover:-translate-y-0.5" data-alert-type="balance">
                    Low Balance
                </button>
                <button class="alert-btn px-4 py-3 border-2 border-blue-600 bg-white text-blue-600 rounded-lg font-semibold hover:shadow-md transition-all hover:-translate-y-0.5" data-alert-type="verification">
                    Verification Required
                </button>
                <button class="alert-btn px-4 py-3 border-2 border-blue-600 bg-white text-blue-600 rounded-lg font-semibold hover:shadow-md transition-all hover:-translate-y-0.5" data-alert-type="maintenance">
                    System Maintenance
                </button>
                <button class="alert-btn px-4 py-3 border-2 border-blue-600 bg-white text-blue-600 rounded-lg font-semibold hover:shadow-md transition-all hover:-translate-y-0.5" data-alert-type="promotion">
                    Special Offer

        <!-- Alert Display -->
        <div class="p-8 bg-white">
            <div class="alert border-l-4 p-5 rounded-lg mb-5" id="mainAlert">
                <!-- Alert content will be dynamically inserted here -->
            </div>
        </div>

        <!-- Alert Details -->
        <div class="p-8 bg-gray-50 border-t-2 border-gray-200">
            <h3 class="text-xl font-semibold mb-5 text-gray-800">Alert Details</h3>
            <div id="alertDetails" class="bg-white p-5 rounded-lg border border-gray-200">
                <!-- Details will be dynamically inserted here -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="bg-gray-50 p-5 text-center border-t-2 border-gray-200 text-gray-600 text-sm">
            <p>&copy; 2024 Secure Bank. If you didn't recognize this alert, contact support immediately.
